apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: practice-dev-karpenter-node # node IAM role from Terraform

  # AL2023. Karpenter picks the arm64 image from the NodePool requirements.
  # Pinned AMI release. Nodes change only when you change this line in Git.
  # Update it on purpose (also after an EKS upgrade). Karpenter then replaces the nodes (drift).
  # Find the current release: kubectl get ec2nodeclass default -o jsonpath='{.status.amis[*].name}'
  amiSelectorTerms:
    - alias: al2023@v20261012

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: practice-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: practice-dev

  # IMDSv2 only. Hop limit 1: pods cannot read node credentials. Pods use Pod Identity.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: practice-k8s
    Environment: dev
    ManagedBy: karpenter
