apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  role: practice-dev-karpenter-node # node IAM role from Terraform

  # AL2023. Karpenter picks the arm64 image from the NodePool requirements.
  # "latest" follows the cluster version: after an EKS upgrade, nodes drift and get replaced.
  # Production: pin a version (example: al2023@v20260928) and update it in Git.
  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: practice-dev
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: practice-dev

  # IMDSv2 only. Hop limit 1: pods cannot read node credentials. Pods use Pod Identity.
  metadataOptions:
    httpEndpoint: enabled
    httpTokens: required
    httpPutResponseHopLimit: 1

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: practice-k8s
    Environment: dev
    ManagedBy: karpenter
