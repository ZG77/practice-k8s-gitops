apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot-arm64
spec:
  template:
    metadata:
      labels:
        node-role: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        # Many families and sizes = more Spot pools = fewer interruptions.
        # 16 instance types in total (spotToSpotConsolidation needs 15+).
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t4g", "c6g", "c7g", "m6g", "m7g"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["small", "medium", "large", "xlarge"]

      # Replace every node after 7 days (fresh AMI, no long-lived nodes).
      expireAfter: 168h

  # Cost cap: Karpenter stops creating nodes at this total.
  limits:
    cpu: "16"
    memory: 64Gi

  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
